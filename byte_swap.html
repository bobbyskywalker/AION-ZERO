<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byte pair swapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --ink: #1b2330;
    --muted: #5d6b7e;
    --line: #cfd6df;
    --accent: #2f5bea;
    --accent-ink: #ffffff;
    --warn-bg: #fff3d6;
    --warn-ink: #6b4a00;
    --ok: #17794a;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d;
      --panel: #1a202a;
      --ink: #e6ebf2;
      --muted: #93a0b3;
      --line: #2e3745;
      --accent: #6f8cff;
      --accent-ink: #0d1220;
      --warn-bg: #3a2f10;
      --warn-ink: #f1d48a;
      --ok: #55c98d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161d;
    --panel: #1a202a;
    --ink: #e6ebf2;
    --muted: #93a0b3;
    --line: #2e3745;
    --accent: #6f8cff;
    --accent-ink: #0d1220;
    --warn-bg: #3a2f10;
    --warn-ink: #f1d48a;
    --ok: #55c98d;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 70ch; font-size: .95rem; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .pane {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    min-height: 52px;
  }
  .pane-head h2 { font-size: .95rem; font-weight: 600; margin: 0; }
  .actions { display: flex; gap: 8px; }
  button {
    font: inherit;
    font-size: .875rem;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button.primary:hover { filter: brightness(1.08); }
  button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  textarea {
    width: 100%;
    flex: 1;
    min-height: 340px;
    resize: vertical;
    border: 0;
    border-radius: 0 0 8px 8px;
    padding: 14px;
    background: transparent;
    color: var(--ink);
    font-family: var(--mono);
    font-size: .82rem;
    line-height: 1.6;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
  }
  textarea::placeholder { color: var(--muted); }
  .status {
    margin-top: 12px;
    font-size: .9rem;
    color: var(--muted);
    min-height: 1.5em;
  }
  .status .ok { color: var(--ok); font-weight: 500; }
  .warn {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--warn-bg);
    color: var(--warn-ink);
    font-size: .9rem;
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    button { transition: border-color .12s, filter .12s; }
  }
</style>
</head>
<body>
<main>
  <h1>Byte pair swapper</h1>
  <p class="sub">Paste a C/C++ byte array. Every 0xNN value is swapped with its neighbour (1st with 2nd, 3rd with 4th, and so on), then reformatted at 16 values per line.</p>

  <div class="grid">
    <section class="pane" aria-labelledby="in-title">
      <div class="pane-head">
        <h2 id="in-title">Input</h2>
        <div class="actions">
          <button type="button" id="paste">Paste</button>
          <button type="button" id="clear">Clear</button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" autocomplete="off" placeholder="0x12, 0x34, 0x56, 0x78, ..."></textarea>
    </section>

    <section class="pane" aria-labelledby="out-title">
      <div class="pane-head">
        <h2 id="out-title">Swapped output</h2>
        <div class="actions">
          <button type="button" id="copy" class="primary">Copy output</button>
        </div>
      </div>
      <textarea id="output" spellcheck="false" readonly placeholder="Result appears here as you paste."></textarea>
    </section>
  </div>

  <div class="warn" id="warn" hidden></div>
  <div class="status" id="status" aria-live="polite"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const input = $("input"), output = $("output"), statusEl = $("status"), warn = $("warn");

  function convert(text) {
    const values = text.match(/0x([0-9a-fA-F]{2})/g) || [];
    const swapped = [];
    for (let i = 0; i + 1 < values.length; i += 2) {
      swapped.push("0x" + values[i + 1].slice(2));
      swapped.push("0x" + values[i].slice(2));
    }
    const odd = values.length % 2 === 1;
    if (odd) swapped.push("0x" + values[values.length - 1].slice(2)); // no partner: keep as is

    const lines = [];
    for (let i = 0; i < swapped.length; i += 16) {
      lines.push("    " + swapped.slice(i, i + 16).join(", ") + ",");
    }
    return { out: lines.join("\n"), count: values.length, lines: lines.length, odd };
  }

  function run() {
    const r = convert(input.value);
    output.value = r.out;
    warn.hidden = !r.odd;
    if (r.odd) {
      warn.textContent = "The input has an odd number of bytes (" + r.count +
        "). The last byte has no partner, so it was left unchanged.";
    }
    statusEl.innerHTML = r.count
      ? '<span class="ok">' + r.count + " bytes</span> swapped into " + r.lines + (r.lines === 1 ? " line." : " lines.")
      : "No 0xNN values found yet.";
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      output.focus();
      output.select();
      try { return document.execCommand("copy"); } catch (e2) { return false; }
    }
  }

  $("copy").addEventListener("click", async () => {
    if (!output.value) { statusEl.textContent = "Nothing to copy yet."; return; }
    const ok = await copyText(output.value);
    statusEl.innerHTML = ok
      ? '<span class="ok">Copied to clipboard.</span>'
      : "Copy failed. Select the output and copy it manually.";
  });

  $("paste").addEventListener("click", async () => {
    try {
      input.value = await navigator.clipboard.readText();
      run();
    } catch (e) {
      input.focus();
      statusEl.textContent = "Clipboard access is blocked here. Click the input and press Ctrl+V (Cmd+V on Mac).";
    }
  });

  $("clear").addEventListener("click", () => {
    input.value = "";
    run();
    input.focus();
  });

  input.addEventListener("input", run);
  run();
</script>
</body>
</html>
